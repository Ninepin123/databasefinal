<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>推薦信管理 | 學生端</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#4F46E5",
                        secondary: "#9333EA",
                    },
                    fontFamily: {
                        display: ["Lexend", "Noto Sans TC", "sans-serif"],
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-50 text-slate-800 font-display min-h-screen">

    <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="flex items-center justify-center size-9 rounded-xl bg-primary/10 text-primary shadow-sm">
                    <span class="material-symbols-outlined text-[24px]">school</span>
                </div>
                <h1 class="font-bold text-xl tracking-tight">ScholarshipHub</h1>
            </div>
            <nav class="hidden md:flex gap-6 text-sm font-medium text-slate-500">
                <a href="../student/profile.html" class="hover:text-primary transition-colors">儀表板</a>
                <a href="../student/applications.html" class="hover:text-primary transition-colors">我的申請</a>
                <a href="#" class="text-primary">推薦信</a>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-8 gap-4">
            <div>
                <h2 class="text-3xl font-black text-slate-900">推薦信管理</h2>
                <p class="text-slate-500 mt-1">查看與管理您的推薦信申請狀態</p>
            </div>
            <button onclick="openRequestModal()"
                class="flex items-center gap-2 bg-primary hover:bg-indigo-600 text-white px-5 py-2.5 rounded-xl font-bold transition-all shadow-lg shadow-indigo-500/30 active:scale-95">
                <span class="material-symbols-outlined text-[20px]">add_circle</span>
                申請推薦信
            </button>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead
                        class="bg-gray-50/50 border-b border-gray-100 text-xs text-slate-400 uppercase font-bold tracking-wider">
                        <tr>
                            <th class="px-6 py-4">相關獎學金</th>
                            <th class="px-6 py-4">推薦人 (導師)</th>
                            <th class="px-6 py-4">申請日期</th>
                            <th class="px-6 py-4 text-center">狀態</th>
                            <th class="px-6 py-4 text-right">操作</th>
                        </tr>
                    </thead>
                    <tbody id="recommendations-body" class="divide-y divide-gray-100">
                        <!-- JS injected rows -->
                    </tbody>
                </table>
            </div>
            <div id="empty-state" class="hidden flex flex-col items-center justify-center py-16 text-center">
                <div class="bg-gray-50 p-4 rounded-full mb-4">
                    <span class="material-symbols-outlined text-4xl text-gray-300">drafts</span>
                </div>
                <h3 class="text-lg font-bold text-slate-700">尚無推薦信申請</h3>
                <p class="text-slate-500 mt-1 max-w-sm mx-auto">當您申請需要推薦信的獎學金時，請點擊右上角「申請推薦信」按鈕。</p>
            </div>
        </div>
    </main>

    <!-- Request Modal -->
    <div id="request-modal" class="fixed inset-0 z-50 hidden" aria-labelledby="modal-title" role="dialog"
        aria-modal="true">
        <div class="fixed inset-0 bg-gray-900/50 backdrop-blur-sm transition-opacity" onclick="closeRequestModal()">
        </div>
        <div class="fixed inset-0 z-10 overflow-y-auto">
            <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
                <div
                    class="relative transform overflow-hidden rounded-2xl bg-white text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-lg">
                    <div class="bg-white px-4 pb-4 pt-5 sm:p-6 sm:pb-4">
                        <div class="sm:flex sm:items-start">
                            <div
                                class="mx-auto flex h-12 w-12 flex-shrink-0 items-center justify-center rounded-full bg-indigo-100 sm:mx-0 sm:h-10 sm:w-10">
                                <span class="material-symbols-outlined text-primary">forward_to_inbox</span>
                            </div>
                            <div class="mt-3 text-center sm:ml-4 sm:mt-0 sm:text-left w-full">
                                <h3 class="text-lg font-semibold leading-6 text-gray-900" id="modal-title">申請推薦信</h3>
                                <div class="mt-4 flex flex-col gap-4">
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">選擇獎學金申請</label>
                                        <select id="application-select"
                                            class="w-full rounded-lg border-gray-300 focus:border-primary focus:ring-primary">
                                            <option value="">載入中...</option>
                                        </select>
                                        <p class="text-xs text-gray-400 mt-1">僅列出尚未申請推薦信的項目</p>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">推薦人 (您的導師)</label>
                                        <input type="text" id="advisor-name"
                                            class="w-full rounded-lg bg-gray-50 border-gray-300 text-gray-500 cursor-not-allowed"
                                            readonly value="載入中...">
                                        <input type="hidden" id="advisor-id">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="bg-gray-50 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6">
                        <button type="button" onclick="submitRequest()"
                            class="inline-flex w-full justify-center rounded-lg bg-primary px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-600 sm:ml-3 sm:w-auto">送出申請</button>
                        <button type="button" onclick="closeRequestModal()"
                            class="mt-3 inline-flex w-full justify-center rounded-lg bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50 sm:mt-0 sm:w-auto">取消</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../../js/config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', init);

        const API_BASE = CONFIG.API_BASE;
        const token = localStorage.getItem('authToken');

        async function init() {
            if (!token) {
                window.location.href = '../auth/login.html';
                return;
            }
            await loadProfile();
            await loadRecommendations();
        }

        async function loadProfile() {
            try {
                const res = await fetch(`${API_BASE}/profile`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const user = await res.json();
                if (user.student && user.student.advisor) {
                    document.getElementById('advisor-name').value = user.student.advisor.user.name; // Advisor has User
                    document.getElementById('advisor-id').value = user.student.advisor.advisorId;
                } else {
                    document.getElementById('advisor-name').value = "未分配導師";
                }
            } catch (e) {
                console.error("Profile load error", e);
            }
        }

        async function loadRecommendations() {
            try {
                const res = await fetch(`${API_BASE}/recommendations/student`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const recs = await res.json();
                const tbody = document.getElementById('recommendations-body');

                if (recs.length === 0) {
                    document.getElementById('empty-state').classList.remove('hidden');
                    tbody.innerHTML = '';
                    return;
                }

                document.getElementById('empty-state').classList.add('hidden');

                tbody.innerHTML = recs.map(rec => {
                    const status = rec.content ? '已完成' : '待撰寫';
                    const statusColor = rec.content ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700';
                    const fillDate = rec.fillDate ? new Date(rec.fillDate).toLocaleDateString() : '--';

                    return `
                        <tr class="hover:bg-gray-50 transition-colors">
                            <td class="px-6 py-4 font-medium text-slate-900">
                                ${rec.application?.scholarship?.name || '未知獎學金'}
                            </td>
                            <td class="px-6 py-4 text-slate-600">
                                ${rec.advisor?.user?.name || '未知導師'}
                            </td>
                            <td class="px-6 py-4 text-slate-500 text-sm">
                                ${fillDate}
                            </td>
                            <td class="px-6 py-4 text-center">
                                <span class="px-2 py-1 rounded text-xs font-bold ${statusColor}">${status}</span>
                            </td>
                            <td class="px-6 py-4 text-right">
                                ${rec.content ? `<button onclick="viewLetter('${encodeURIComponent(rec.content)}')" class="text-primary hover:underline text-sm font-bold">查看推薦信</button>` : '<span class="text-slate-400 text-xs">等待中</span>'}
                            </td>
                        </tr>
                     `;
                }).join('');

            } catch (e) {
                console.error(e);
            }
        }

        async function openRequestModal() {
            document.getElementById('request-modal').classList.remove('hidden');
            const select = document.getElementById('application-select');
            select.innerHTML = '<option>載入中...</option>';

            // Fetch My Applications
            try {
                const res = await fetch(`${API_BASE}/scholarships/my-applications`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const apps = await res.json();

                // We should filter out apps that ALREADY have recommendations
                // Ideally backend handles this, but here we can do a simple check if we had list of recs
                // For simplicity, just show all apply-able or let backend error if duplicate

                if (apps.length === 0) {
                    select.innerHTML = '<option value="">無可用的申請</option>';
                    return;
                }

                select.innerHTML = apps.map(app =>
                    `<option value="${app.applicationId}">${app.scholarship.name} (申請日: ${new Date(app.submitDate).toLocaleDateString()})</option>`
                ).join('');

            } catch (e) {
                select.innerHTML = '<option value="">載入失敗</option>';
            }
        }

        function closeRequestModal() {
            document.getElementById('request-modal').classList.add('hidden');
        }

        async function submitRequest() {
            const appId = document.getElementById('application-select').value;
            const advisorId = document.getElementById('advisor-id').value;

            if (!appId || !advisorId) {
                alert("資料不完整 (請確認您有申請獎學金且已分配導師)");
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/recommendations/request`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ applicationId: parseInt(appId), advisorId: parseInt(advisorId) })
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.message || 'Request failed');
                }

                alert('申請成功！');
                closeRequestModal();
                loadRecommendations();
            } catch (e) {
                alert('申請失敗: ' + e.message);
            }
        }

        function viewLetter(content) {
            const decoded = decodeURIComponent(content);
            alert("推薦信內容:\n\n" + decoded);
            // Ideally use a better modal
        }
    </script>
</body>

</html>
