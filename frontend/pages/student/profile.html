    <script src="../../js/config.js"></script>
    <script>
        const API_BASE = CONFIG.API_BASE;

        // 檢查登入狀態
        function checkAuth() {
            const token = localStorage.getItem('authToken');
            if (!token) {
                window.location.href = '../auth/login.html';
                return null;
            }
            return token;
        }

        // 載入個人資料 (包含 Header 資訊)
        async function loadProfile() {
            const token = checkAuth();
            if (!token) return;

            try {
                const response = await fetch(`${API_BASE}/profile`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const profile = await response.json();
                    console.log('Profile loaded:', profile);

                    // 1. Update Header Info
                    document.getElementById("user-name-header").textContent = profile.name || "未知使用者";
                    const roleMap = { STUDENT: "學生", TEACHER: "導師", ADMIN: "管理員" };
                    document.getElementById("user-role-header").textContent = roleMap[profile.role] || profile.role;

                    // 2. Fill Form Data
                    document.getElementById('full-name').value = profile.name || '';
                    document.getElementById('email').value = profile.email || '';
                    document.getElementById('phone').value = profile.phone || '';
                    document.getElementById('address').value = profile.address || '';
                    document.getElementById('student-id').value = profile.account || '';
                    document.getElementById('major').value = profile.department || '';
                    // Assuming GPA or similar fields might not be in the current Profile DTO, handled gracefully

                    // Update display section
                    document.getElementById('display-name').textContent = profile.name || '同學';
                    document.getElementById('display-account').textContent = `學號: ${profile.account}`;

                    // Set Grade (Year)
                    const yearSelect = document.getElementById('year');
                    if (profile.grade) {
                        for (let i = 0; i < yearSelect.options.length; i++) {
                            const gradeMap = { '1': 0, '2': 1, '3': 2, '4': 3 };
                            if (gradeMap[profile.grade] !== undefined) {
                                yearSelect.selectedIndex = gradeMap[profile.grade];
                                break;
                            }
                        }
                    }
                } else if (response.status === 401) {
                    localStorage.clear();
                    window.location.href = '../auth/login.html';
                }
            } catch (error) {
                console.error('Load profile error:', error);
            }
        }

        // 儲存變更
        async function saveProfile() {
            const token = checkAuth();
            if (!token) return;

            // Show loading state implicitly or by button text
            const saveBtn = document.querySelector('button[onclick="saveProfile()"]');
            const originalText = saveBtn.innerHTML;
            saveBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span> 儲存中...';
            saveBtn.disabled = true;

            const data = {
                name: document.getElementById('full-name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value,
                department: document.getElementById('major').value,
                grade: (document.getElementById('year').selectedIndex + 1).toString()
            };

            try {
                const response = await fetch(`${API_BASE}/profile`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    alert('資料已成功更新！');
                    loadProfile(); // Refresh data
                } else {
                    const error = await response.json();
                    alert('儲存失敗：' + (error.message || '未知錯誤'));
                }
            } catch (error) {
                alert('無法連線到伺服器');
            } finally {
                saveBtn.innerHTML = originalText;
                saveBtn.disabled = false;
            }
        }

        // Load notification count for navbar badge
        async function loadNotificationCount() {
            const token = localStorage.getItem('authToken');
            const userStr = localStorage.getItem('user');
            if (!token || !userStr) return;

            const user = JSON.parse(userStr);
            if (user.role !== 'STUDENT') return;

            try {
                const res = await fetch(`${API_BASE}/notifications/unread-count`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    const badge = document.getElementById('nav-notification-badge');
                    if (badge && data.count > 0) {
                        badge.textContent = data.count > 99 ? '99+' : data.count;
                        badge.classList.remove('hidden');
                        badge.classList.add('flex');
                    }
                }
            } catch (e) {
                console.error('Failed to load notification count:', e);
            }
        }

        // 登出
        function logout() {
            localStorage.clear();
            window.location.href = '../auth/login.html';
        }

        // 顯示/隱藏密碼修改 Modal
        function showPasswordModal() {
            document.getElementById('passwordModal').classList.remove('hidden');
            document.getElementById('passwordModal').classList.add('flex');
            document.getElementById('passwordForm').reset();
            document.getElementById('passwordMessage').classList.add('hidden');
        }

        function hidePasswordModal() {
            document.getElementById('passwordModal').classList.add('hidden');
            document.getElementById('passwordModal').classList.remove('flex');
        }

        function showPasswordMessage(text, isError) {
            const msg = document.getElementById('passwordMessage');
            msg.textContent = text;
            msg.className = `mb-4 p-3 rounded-xl text-sm font-medium ${isError ? 'bg-red-50 text-red-600 border border-red-100' : 'bg-green-50 text-green-600 border border-green-100'}`;
            msg.classList.remove('hidden');
        }

        // 修改密碼
        async function changePassword(e) {
            e.preventDefault();
            const token = checkAuth();
            if (!token) return;

            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                showPasswordMessage('新密碼與確認密碼不相符', true);
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/profile/password`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ oldPassword, newPassword })
                });

                if (response.ok) {
                    showPasswordMessage('密碼修改成功！', false);
                    setTimeout(() => hidePasswordModal(), 1500);
                } else {
                    const error = await response.json();
                    showPasswordMessage(error.message || '密碼修改失敗', true);
                }
            } catch (error) {
                showPasswordMessage('無法連線到伺服器', true);
            }
        }

        // Smooth Scroll Tab Switching (Optional simple scroll)
        function switchTab(id) {
            document.getElementById(id).scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // Logo navigation helper
        function setupLogoNavigation() {
            document.getElementById('logo-link').addEventListener('click', (e) => {
                e.preventDefault();
                const userStr = localStorage.getItem('user');
                if (userStr) {
                    const user = JSON.parse(userStr);
                    const role = user.role?.toUpperCase();
                    if (role === 'STUDENT') {
                        window.location.href = 'profile.html';
                    } else if (role === 'ADMIN') {
                        window.location.href = '../scholarship/list.html';
                    } else if (role === 'REVIEWER') {
                        window.location.href = '../reviewer/dashboard.html';
                    } else if (role === 'TEACHER' || role === 'ADVISOR') {
                        window.location.href = '../teacher/manage-recommendations.html';
                    } else {
                        window.location.href = '../../index.html';
                    }
                } else {
                    window.location.href = '../../index.html';
                }
            });
        }

        // 頁面載入
        window.onload = function () {
            loadProfile();
            loadNotificationCount();
            setupLogoNavigation();

            // 綁定儲存按鈕
            document.querySelector('button[type="button"]:last-child').addEventListener('click', saveProfile);

            // 綁定密碼表單
            document.getElementById('passwordForm').addEventListener('submit', changePassword);

            // 綁定登出
            document.querySelectorAll('a[href="#"]').forEach(a => {
                if (a.textContent.includes('登出') || a.parentElement.id === 'logout-btn-header') {
                    a.addEventListener('click', (e) => { e.preventDefault(); logout(); });
                }
            });
            // Specific binding for header logout button if not caught by above
            const headerLogout = document.getElementById('logout-btn-header');
            if (headerLogout) headerLogout.addEventListener('click', logout);

            // Admin Logic
            const userStr = localStorage.getItem('user');
            if (userStr) {
                try {
                    const user = JSON.parse(userStr);
                    const role = user.role?.toUpperCase();
                    const nav = document.querySelector('nav');

                    // 老師/導師角色：新增推薦信管理連結
                    if (role === 'ADVISOR' || role === 'TEACHER') {
                        if (nav) {
                            const advisorLink = document.createElement('a');
                            advisorLink.className = 'nav-link';
                            advisorLink.href = '../teacher/manage-recommendations.html';
                            advisorLink.innerHTML = '<span class="flex items-center gap-1 text-primary"><span class="material-symbols-outlined text-[18px]">history_edu</span>推薦信管理</span>';
                            nav.appendChild(advisorLink);
                        }
                    }

                    // 管理員角色
                    if (role === 'ADMIN') {
                        // 隱藏「我的申請」導航連結
                        const myApplicationsLink = document.getElementById('nav-my-applications');
                        if (myApplicationsLink) {
                            myApplicationsLink.style.display = 'none';
                        }

                        // 隱藏「學籍資料」標籤
                        const academicTab = document.getElementById('tab-academic');
                        if (academicTab) {
                            academicTab.style.display = 'none';
                        }

                        // 隱藏「學籍成績」區塊
                        const academicSection = document.getElementById('academic');
                        if (academicSection) {
                            academicSection.style.display = 'none';
                        }

                        if (nav) {
                            const adminLink = document.createElement('a');
                            adminLink.className = 'nav-link';
                            adminLink.href = '../scholarship/add.html';
                            adminLink.innerHTML = '<span class="flex items-center gap-1 text-primary"><span class="material-symbols-outlined text-[18px]">add_circle</span>發布獎學金</span>';
                            nav.appendChild(adminLink);

                            const sponsorUnitLink = document.createElement('a');
                            sponsorUnitLink.className = 'nav-link';
                            sponsorUnitLink.href = '../sponsor-unit/list.html';
                            sponsorUnitLink.innerHTML = '<span class="flex items-center gap-1 text-primary"><span class="material-symbols-outlined text-[18px]">business</span>獎助單位</span>';
                            nav.appendChild(sponsorUnitLink);
                        }
                    }
                } catch (e) { console.error(e); }
            }
        }
    </script>
</body>
