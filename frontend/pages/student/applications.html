    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4F46E5",
                        "primary-dark": "#4338ca",
                        "background-light": "#F8FAFC",

    <style type="text/tailwindcss">
        @layer components {
            .nav-link {
                @apply text-slate-500 hover:text-primary transition-colors font-medium relative py-1;
            }
            .nav-link:hover {
                @apply text-primary;
            }
            .nav-link-active {
                @apply text-primary font-bold relative py-1;
            }
            .nav-link-active::after {
                content: '';
                @apply absolute bottom-[-21px] left-0 w-full h-[3px] bg-primary rounded-t-full shadow-[0_-2px_6px_rgba(79,70,229,0.3)];
                view-transition-name: nav-indicator;

        .custom-scrollbar::-webkit-scrollbar-track {

                        class="status-filter whitespace-nowrap flex h-10 items-center px-5 rounded-xl bg-transparent text-slate-500 text-sm font-semibold hover:bg-primary/5 hover:text-primary transition-colors">

            <!-- Applications Table -->

    <!-- 邀請老師撰寫推薦信 Modal -->
    <div id="invite-modal" class="fixed inset-0 z-50 hidden" role="dialog" aria-modal="true">
        <div class="fixed inset-0 bg-gray-900/50 backdrop-blur-sm" onclick="closeInviteModal()"></div>
        <div class="fixed inset-0 z-10 overflow-y-auto">
            <div class="flex min-h-full items-center justify-center p-4">
                <div class="relative bg-white rounded-2xl shadow-xl w-full max-w-lg">
                    <div class="p-6">
                        <h3 class="text-xl font-bold mb-4 flex items-center gap-2">
                            <span class="material-symbols-outlined text-primary">person_add</span>
                            邀請老師撰寫推薦信
                        </h3>
                        <p class="text-sm text-slate-500 mb-4">
                            獎學金：<span id="modal-scholarship-name" class="font-bold text-slate-700">--</span>
                        </p>
                        <div id="advisors-loading" class="text-center py-6 text-slate-500">
                            <span
                                class="material-symbols-outlined animate-spin text-primary text-3xl">progress_activity</span>

                        </div>
                        <div id="advisors-list" class="hidden space-y-3 max-h-64 overflow-y-auto">

    <script src="../../js/config.js"></script>
    <script>
        const API_BASE = CONFIG.API_BASE;

        // 全局變數來儲存資料
        let allApplications = [];
        let allRecommendations = [];
        let currentStatusFilter = 'ALL';
        let currentSearchText = '';

        // Check Auth
        function checkAuth() {
            const token = localStorage.getItem('authToken');
            if (!token) {
                alert('請先登入');
                window.location.href = '../auth/login.html';
                return null;
            }
            return token;
        }

        // Logic to load Header User Info (Consistent with Profile Page)
        function loadHeaderInfo() {
            const userStr = localStorage.getItem('user');
            if (userStr) {
                const user = JSON.parse(userStr);
                document.getElementById("user-name-header").textContent = user.name || "未知使用者";
                const roleMap = { STUDENT: "學生", TEACHER: "導師", ADMIN: "管理員" };
                document.getElementById("user-role-header").textContent = roleMap[user.role] || user.role;
            }
        }

        // Load notification count for navbar badge
        async function loadNotificationCount() {
            const token = localStorage.getItem('authToken');
            const userStr = localStorage.getItem('user');
            if (!token || !userStr) return;

            const user = JSON.parse(userStr);
            if (user.role !== 'STUDENT') return; // Only students receive notifications

            try {
                const res = await fetch(`${API_BASE}/notifications/unread-count`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    const badge = document.getElementById('nav-notification-badge');
                    if (badge && data.count > 0) {
                        badge.textContent = data.count > 99 ? '99+' : data.count;
                        badge.classList.remove('hidden');
                        badge.classList.add('flex');
                    }
                }
            } catch (e) {
                console.error('Failed to load notification count:', e);
            }
        }

        // Logout logic
        function logout() {
            localStorage.clear();
            window.location.href = '../auth/login.html';
        }

        // Fetch Applications
        async function loadApplications() {
            const tbody = document.getElementById('applications-body');
            const token = checkAuth();
            if (!token) return;

            try {
                // 同時取得申請和推薦信資料
                const [appsRes, recsRes] = await Promise.all([
                    fetch(`${API_BASE}/scholarships/my-applications`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    }),
                    fetch(`${API_BASE}/recommendations/student`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    })
                ]);

                if (!appsRes.ok) throw new Error('Failed to fetch applications');

                allApplications = await appsRes.json();
                allRecommendations = recsRes.ok ? await recsRes.json() : [];

                if (allApplications.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-10 text-center text-slate-500">尚無申請紀錄</td></tr>';
                    return;
                }

                // 渲染申請列表
                renderApplications();

            } catch (error) {
                console.error(error);
                tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-5 text-center text-red-500">載入失敗</td></tr>';
            }
        }

        // 渲染申請列表
        function renderApplications() {
            const tbody = document.getElementById('applications-body');

            // 建立推薦信 map (applicationId -> recommendation)
            const recMap = {};
            allRecommendations.forEach(rec => {
                recMap[rec.applicationId] = rec;
            });

            // 篩選申請
            let filteredApps = allApplications;

            // 狀態篩選
            if (currentStatusFilter !== 'ALL') {
                filteredApps = filteredApps.filter(app => app.status === currentStatusFilter);
            }

            // 搜尋篩選
            if (currentSearchText.trim()) {
                const searchLower = currentSearchText.toLowerCase();
                filteredApps = filteredApps.filter(app => {
                    const scholarshipName = app.scholarship?.name?.toLowerCase() || '';
                    return scholarshipName.includes(searchLower);
                });
            }

            // 如果沒有符合的結果
            if (filteredApps.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-10 text-center text-slate-500">沒有符合條件的申請</td></tr>';
                return;
            }

            tbody.innerHTML = filteredApps.map(app => {
                const scholarship = app.scholarship || { name: '未知獎學金', amount: 0, sponsorUnit: {} };
                const statusClass = getStatusClass(app.status);
                const statusText = getStatusText(app.status);
                const isPending = app.status === 'PENDING';

                // Safe date formatting
                let submitDate = 'N/A';
                if (app.submitDate) {
                    submitDate = new Date(app.submitDate).toLocaleDateString();
                }

                // 推薦信狀態
                const rec = recMap[app.applicationId];
                let recStatusHtml = '';
                if (rec) {
                    const advisorInfo = `<div class="text-xs text-slate-500 mt-1">推薦老師: <span class="font-bold text-slate-700">${rec.advisorName || '未知'}</span></div>`;

                    if (rec.status === 'SUBMITTED' || rec.content) {
                        recStatusHtml = `<div><span class="inline-flex items-center gap-1 text-xs text-emerald-600 font-bold"><span class="material-symbols-outlined text-[14px]">check_circle</span>已完成</span>${advisorInfo}</div>`;
                    } else {
                        recStatusHtml = `<div><span class="inline-flex items-center gap-1 text-xs text-amber-600 font-bold"><span class="material-symbols-outlined text-[14px]">schedule</span>待撰寫</span>${advisorInfo}</div>`;
                    }
                } else {
                    recStatusHtml = `<button onclick="openInviteModal(${app.applicationId}, '${scholarship.name.replace(/'/g, "\\'")}')"
                        class="text-xs text-primary font-bold hover:underline flex items-center gap-1">
                        <span class="material-symbols-outlined text-[14px]">person_add</span>邀請老師
                    </button>`;
                }

                // 操作按鈕
                let actionHtml = `
                    <a href="../scholarship/detail.html?id=${scholarship.scholarshipId}" class="text-slate-500 hover:text-primary transition-colors inline-flex items-center gap-1 text-sm font-bold">
                        <span>詳情</span>
                        <span class="material-symbols-outlined !text-[18px]">arrow_forward</span>
                    </a>`;

                if (isPending) {
                    actionHtml += `
                        <button onclick="deleteApplication(${app.applicationId})"
                            class="ml-3 text-slate-400 hover:text-red-500 transition-colors" title="刪除申請">
                            <span class="material-symbols-outlined !text-[18px]">delete</span>
                        </button>`;
                }

                return `
                    <tr class="group hover:bg-slate-50/80 transition-colors">
                        <td class="px-6 py-5">
                            <div class="flex items-center gap-4">
                                <div class="size-11 rounded-xl bg-blue-100 flex items-center justify-center text-blue-600 shadow-sm group-hover:scale-110 transition-transform duration-300">
                                    <span class="material-symbols-outlined">school</span>
                                </div>
                                <div>
                                    <p class="text-[#0f172a] font-bold text-sm">${scholarship.name}</p>
                                    <p class="text-slate-500 text-xs mt-1 font-medium bg-slate-100 inline-block px-1.5 py-0.5 rounded">
                                        ${scholarship.sponsorUnit ? scholarship.sponsorUnit.unitName : '未知單位'}
                                    </p>
                                </div>
                            </div>
                        </td>
                        <td class="px-6 py-5 text-sm text-slate-500 font-semibold">
                            ${submitDate}
                        </td>
                        <td class="px-6 py-5 text-sm text-[#0f172a] font-bold">
                            $${(scholarship.amount || 0).toLocaleString()}
                        </td>
                        <td class="px-6 py-5">
                            ${recStatusHtml}
                        </td>
                        <td class="px-6 py-5 text-center">
                            <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold ${statusClass}">
                                ${statusText}
                            </span>
                        </td>
                        <td class="px-6 py-5 text-right flex items-center justify-end">
                            ${actionHtml}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // 更新狀態按鈕樣式
        function updateStatusButtons() {
            const buttons = document.querySelectorAll('.status-filter');
            buttons.forEach(btn => {
                const status = btn.getAttribute('data-status');
                if (status === currentStatusFilter) {
                    btn.className = 'status-filter whitespace-nowrap flex h-10 items-center px-5 rounded-xl bg-slate-100 text-[#0f172a] text-sm font-bold hover:bg-slate-200 transition-colors';
                } else {
                    btn.className = 'status-filter whitespace-nowrap flex h-10 items-center px-5 rounded-xl bg-transparent text-slate-500 text-sm font-semibold hover:bg-primary/5 hover:text-primary transition-colors';
                }
            });
        }

        // 設定狀態篩選
        function setStatusFilter(status) {
            currentStatusFilter = status;
            updateStatusButtons();
            renderApplications();
        }

        // 設定搜尋文字
        function setSearchText(text) {
            currentSearchText = text;
            renderApplications();
        }

        function getStatusClass(status) {
            switch (status) {
                case 'APPROVED': return 'bg-emerald-50 text-emerald-600 border border-emerald-200';
                case 'REJECTED': return 'bg-rose-50 text-rose-600 border border-rose-200';
                default: return 'bg-amber-50 text-amber-600 border border-amber-200';
            }
        }

        function getStatusText(status) {
            switch (status) {
                case 'APPROVED': return '已通過';
                case 'REJECTED': return '已拒絕';
                default: return '待審核';
            }
        }

        // 開啟邀請老師 Modal
        async function openInviteModal(applicationId, scholarshipName) {
            document.getElementById('modal-app-id').value = applicationId;
            document.getElementById('modal-scholarship-name').textContent = scholarshipName;
            document.getElementById('invite-modal').classList.remove('hidden');
            document.getElementById('advisors-loading').classList.remove('hidden');
            document.getElementById('advisors-list').classList.add('hidden');

            const token = localStorage.getItem('authToken');
            try {
                const res = await fetch(`${API_BASE}/advisors`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) throw new Error('Failed to load advisors');
                const advisors = await res.json();

                document.getElementById('advisors-loading').classList.add('hidden');
                document.getElementById('advisors-list').classList.remove('hidden');

                if (advisors.length === 0) {
                    document.getElementById('advisors-list').innerHTML = '<p class="text-center text-slate-500 py-4">目前沒有可選擇的老師</p>';
                    return;
                }

                document.getElementById('advisors-list').innerHTML = advisors.map(adv => `
                    <div class="p-4 border rounded-xl hover:border-primary hover:bg-primary/5 transition-all flex items-center justify-between cursor-pointer group"
                        onclick="inviteAdvisor(${applicationId}, ${adv.advisorId})">
                        <div class="flex items-center gap-3">
                            <div class="size-10 rounded-full bg-primary/10 text-primary flex items-center justify-center font-bold">
                                ${adv.name ? adv.name.charAt(0) : '?'}
                            </div>
                            <div>
                                <p class="font-bold text-slate-800">${adv.name}</p>
                                <p class="text-xs text-slate-500">${adv.department || ''}${adv.title ? ' · ' + adv.title : ''}</p>
                            </div>
                        </div>
                        <span class="material-symbols-outlined text-slate-400 group-hover:text-primary transition-colors">chevron_right</span>
                    </div>
                `).join('');

            } catch (e) {
                console.error(e);
                document.getElementById('advisors-loading').classList.add('hidden');
                document.getElementById('advisors-list').classList.remove('hidden');
                document.getElementById('advisors-list').innerHTML = '<p class="text-center text-red-500 py-4">載入老師列表失敗</p>';
            }
        }

        function closeInviteModal() {
            document.getElementById('invite-modal').classList.add('hidden');
        }

        // 邀請老師撰寫推薦信
        async function inviteAdvisor(applicationId, advisorId) {
            const token = localStorage.getItem('authToken');
            try {
                const res = await fetch(`${API_BASE}/recommendations/request`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ applicationId, advisorId })
                });

                if (res.ok) {
                    alert('已成功邀請老師撰寫推薦信！');
                    closeInviteModal();
                    loadApplications(); // 重新載入列表
                } else {
                    const err = await res.json();
                    alert('邀請失敗：' + (err.message || err.error || '未知錯誤'));
                }
            } catch (e) {
                alert('無法連線到伺服器');
            }
        }

        // 刪除申請
        async function deleteApplication(applicationId) {
            if (!confirm('確定要刪除此申請嗎？此操作無法復原。')) return;

            const token = localStorage.getItem('authToken');
            try {
                const res = await fetch(`${API_BASE}/scholarships/applications/${applicationId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.ok) {
                    alert('申請已刪除');
                    loadApplications();
                } else {
                    const err = await res.json();
                    alert('刪除失敗：' + (err.error || '未知錯誤'));
                }
            } catch (e) {
                alert('無法連線到伺服器');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadHeaderInfo();
            loadNotificationCount();
            loadApplications();

            document.getElementById('logout-btn-header').addEventListener('click', logout);

                if (userStr) {
                    const user = JSON.parse(userStr);
                    const role = user.role?.toUpperCase();
                    if (role === 'STUDENT') {
                        window.location.href = 'profile.html';
                    } else if (role === 'ADMIN') {
                        window.location.href = '../scholarship/list.html';
                    } else if (role === 'REVIEWER') {
                        window.location.href = '../reviewer/dashboard.html';
                    } else if (role === 'TEACHER' || role === 'ADVISOR') {
                        window.location.href = '../teacher/manage-recommendations.html';
                    } else {
                        window.location.href = '../../index.html';
                    }
                } else {
                    window.location.href = '../../index.html';
                }
            });

            // 狀態篩選按鈕事件
            const statusButtons = document.querySelectorAll('.status-filter');
            statusButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    const status = btn.getAttribute('data-status');
                    setStatusFilter(status);
                });

            // 搜尋框事件
            const searchInput = document.getElementById('search-input');
            searchInput.addEventListener('input', (e) => {

            const userStr = localStorage.getItem('user');

                try {

                    const nav = document.querySelector('nav');

                    // 老師/導師角色：新增推薦信管理連結
                    if (role === 'ADVISOR' || role === 'TEACHER') {

                    if (role === 'ADMIN') {

                            nav.appendChild(sponsorUnitLink);
