<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>推薦信歷史 - 老師後台</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;700;900&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#4361EE",
                        secondary: "#707EAE",
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-[#F4F7FE] text-[#1B2559] font-sans antialiased">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-72 bg-white border-r border-gray-200 hidden lg:flex flex-col z-20">
            <div class="p-8 flex items-center gap-3">
                <div class="size-10 rounded-full bg-primary/10 flex items-center justify-center text-primary">
                    <span class="material-symbols-outlined">school</span>
                </div>
                <a href="#" id="logo-link"
                    class="font-bold text-xl tracking-tight hover:text-primary transition-colors">ScholarshipHub</a>
            </div>
            <nav class="flex-1 px-4 space-y-2">
                <a href="students.html"
                    class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-50 text-slate-500 font-medium transition-all">
                    <span class="material-symbols-outlined">groups</span>
                    學生管理
                </a>
                <a href="manage-recommendations.html"
                    class="flex items-center gap-3 px-4 py-3 rounded-xl bg-primary/5 text-primary font-bold transition-all">
                    <span class="material-symbols-outlined">history_edu</span>
                    推薦信管理
                </a>
                <a href="profile.html"
                    class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-50 text-slate-500 font-medium transition-all">
                    <span class="material-symbols-outlined">person</span>
                    個人資料
                </a>
            </nav>
            <div class="p-4 border-t">
                <button onclick="logout()"
                    class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-red-50 text-slate-500 hover:text-red-500 transition-all w-full">
                    <span class="material-symbols-outlined">logout</span>
                    登出
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col h-full overflow-hidden bg-[#F4F7FE]">
            <!-- Header -->
            <header
                class="bg-white/50 backdrop-blur-sm border-b border-white/50 sticky top-0 z-10 p-4 lg:p-8 flex justify-between items-center">
                <div>
                    <h2 class="text-2xl font-bold">推薦信管理</h2>
                    <p class="text-secondary text-sm">查看您的待處理事項與歷史紀錄</p>
                </div>
                <div class="flex items-center gap-4">
                    <div class="bg-white p-2 rounded-full shadow-sm">
                        <span class="material-symbols-outlined text-secondary">notifications</span>
                    </div>
                </div>
            </header>

            <!-- Refresh Button & Content -->
            <div class="flex-1 overflow-y-auto p-4 lg:p-8">
                <div class="bg-white rounded-[20px] p-6 shadow-sm">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-lg font-bold">推薦信列表</h3>
                        <button onclick="loadRequests()"
                            class="text-primary hover:bg-primary/5 px-3 py-1 rounded-lg text-sm font-bold transition">重新整理</button>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead>
                                <tr
                                    class="text-secondary text-xs font-bold text-left border-b border-gray-100 uppercase tracking-wide">
                                    <th class="pb-3 pl-4">申請學生</th>
                                    <th class="pb-3">獎學金項目</th>
                                    <th class="pb-3">申請日期</th>
                                    <th class="pb-3">狀態</th>
                                    <th class="pb-3 text-right pr-4">操作</th>
                                </tr>
                            </thead>
                            <tbody id="request-table-body" class="text-sm font-medium text-[#1B2559]">
                                <!-- Rows -->
                            </tbody>
                        </table>
                        <div id="loading" class="text-center py-10 text-secondary">載入中...</div>
                        <div id="empty-msg" class="hidden text-center py-10 text-secondary">目前沒有推薦信請求</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="fixed inset-0 z-50 hidden" aria-labelledby="modal-title" role="dialog"
        aria-modal="true">
        <div class="fixed inset-0 bg-gray-900/50 backdrop-blur-sm transition-opacity" onclick="closeEditModal()"></div>
        <div class="fixed inset-0 z-10 overflow-y-auto">
            <div class="flex min-h-full items-center justify-center p-4">
                <div
                    class="relative transform overflow-hidden rounded-2xl bg-white shadow-xl transition-all w-full max-w-2xl">
                    <div class="bg-white p-6">
                        <h3 class="text-xl font-bold mb-4">撰寫推薦信</h3>
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2">內容</label>
                            <textarea id="recommendation-content"
                                class="w-full h-64 rounded-xl border-gray-200 focus:border-primary focus:ring-primary text-sm leading-relaxed"
                                placeholder="請在此撰寫推薦信內容..."></textarea>
                        </div>
                        <input type="hidden" id="edit-app-id">
                    </div>
                    <div class="bg-gray-50 px-6 py-4 flex justify-end gap-3">
                        <button onclick="closeEditModal()"
                            class="px-4 py-2 rounded-lg bg-white border border-gray-200 text-gray-700 font-bold hover:bg-gray-50 text-sm">取消</button>
                        <button onclick="submitRecommendation()"
                            class="px-6 py-2 rounded-lg bg-primary text-white font-bold hover:bg-blue-600 shadow-lg shadow-primary/30 text-sm">提交推薦信</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Student Profile Modal -->
    <div id="student-modal" class="fixed inset-0 z-50 hidden" role="dialog" aria-modal="true">
        <div class="fixed inset-0 bg-gray-900/50 backdrop-blur-sm" onclick="closeStudentModal()"></div>
        <div class="fixed inset-0 z-10 overflow-y-auto">
            <div class="flex min-h-full items-center justify-center p-4">
                <div class="relative bg-white rounded-2xl shadow-xl w-full max-w-md">
                    <div class="p-6">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-xl font-bold flex items-center gap-2">
                                <span class="material-symbols-outlined text-primary">person</span>
                                學生資料
                            </h3>
                            <button onclick="closeStudentModal()" class="text-gray-400 hover:text-gray-600">
                                <span class="material-symbols-outlined">close</span>
                            </button>
                        </div>
                        <div class="space-y-4">
                            <div class="flex items-center gap-4">
                                <div id="student-avatar"
                                    class="size-16 rounded-full bg-primary/10 text-primary flex items-center justify-center font-bold text-xl">
                                </div>
                                <div>
                                    <p id="student-name" class="text-lg font-bold"></p>
                                    <p id="student-department" class="text-sm text-gray-500"></p>
                                </div>
                            </div>
                            <hr class="border-gray-100">
                            <div class="grid grid-cols-2 gap-4 text-sm">
                                <div>
                                    <p class="text-gray-500 font-medium">年級</p>
                                    <p id="student-grade" class="font-bold text-gray-800">--</p>
                                </div>
                                <div>
                                    <p class="text-gray-500 font-medium">電子郵件</p>
                                    <p id="student-email" class="font-bold text-gray-800">--</p>
                                </div>
                                <div>
                                    <p class="text-gray-500 font-medium">電話</p>
                                    <p id="student-phone" class="font-bold text-gray-800">--</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="bg-gray-50 px-6 py-4 flex justify-end">
                        <button onclick="closeStudentModal()"
                            class="px-4 py-2 rounded-lg bg-primary text-white font-bold text-sm hover:bg-blue-600">
                            關閉
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <script src="../../js/config.js"></script>
    <script>
        const API_BASE = CONFIG.API_BASE;
        const token = localStorage.getItem('authToken');

        document.addEventListener('DOMContentLoaded', () => {
            if (!token) {
                window.location.href = '../auth/login.html';
                return;
            }
            loadRequests();

            // Logo click - navigate to role-specific home
            document.getElementById('logo-link').addEventListener('click', (e) => {
                e.preventDefault();
                const userStr = localStorage.getItem('user');
                if (userStr) {
                    const user = JSON.parse(userStr);
                    const role = user.role?.toUpperCase();
                    if (role === 'STUDENT') {
                        window.location.href = '../student/profile.html';
                    } else if (role === 'ADMIN') {
                        window.location.href = '../scholarship/list.html';
                    } else if (role === 'REVIEWER') {
                        window.location.href = '../reviewer/dashboard.html';
                    } else if (role === 'TEACHER' || role === 'ADVISOR') {
                        window.location.href = 'manage-recommendations.html';
                    } else {
                        window.location.href = '../../index.html';
                    }
                } else {
                    window.location.href = '../../index.html';
                }
            });
        });

        function logout() {
            localStorage.removeItem('authToken');
            window.location.href = '../auth/login.html';
        }

        async function loadRequests() {
            const tbody = document.getElementById('request-table-body');
            const loading = document.getElementById('loading');
            const empty = document.getElementById('empty-msg');

            tbody.innerHTML = '';
            loading.classList.remove('hidden');
            empty.classList.add('hidden');

            try {
                const res = await fetch(`${API_BASE}/recommendations/advisor`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!res.ok) throw new Error("Failed to fetch");

                const recs = await res.json();
                loading.classList.add('hidden');

                if (recs.length === 0) {
                    empty.classList.remove('hidden');
                    return;
                }

                tbody.innerHTML = recs.map(rec => {
                    const student = rec.application?.student || {};
                    const studentName = student.name || '未知學生';
                    const scholarshipName = rec.application?.scholarship?.name || '未知獎學金';
                    const date = rec.application?.submitDate ? new Date(rec.application.submitDate).toLocaleDateString() : '--';
                    const isDone = !!rec.content;

                    // 將學生資料編碼為 JSON 字串供彈窗使用
                    const studentData = encodeURIComponent(JSON.stringify(student));

                    return `
                        <tr class="hover:bg-gray-50 transition-colors border-b border-gray-50">
                            <td class="px-4 py-4">
                                <div class="flex items-center gap-3">
                                    <div class="size-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold text-xs uppercase">
                                        ${studentName.charAt(0)}
                                    </div>
                                    <button onclick="openStudentModal('${studentData}')" class="font-bold text-primary hover:underline cursor-pointer">${studentName}</button>
                                </div>
                            </td>
                            <td class="py-4 font-medium text-secondary">${scholarshipName}</td>
                            <td class="py-4 text-secondary">${date}</td>
                            <td class="py-4">
                                <span class="px-2 py-1 rounded text-xs font-bold ${isDone ? 'bg-green-100 text-green-600' : 'bg-amber-100 text-amber-600'}">
                                    ${isDone ? '已完成' : '待處理'}
                                </span>
                            </td>
                            <td class="py-4 text-right pr-4 flex items-center justify-end gap-1">
                                <button onclick="openEditModal(${rec.applicationId}, '${rec.content ? encodeURIComponent(rec.content) : ''}')" class="text-primary hover:bg-primary/10 p-2 rounded-lg transition-colors" title="${isDone ? '編輯推薦信' : '撰寫推薦信'}">
                                    <span class="material-symbols-outlined text-[20px]">${isDone ? 'edit' : 'edit_square'}</span>
                                </button>
                                ${isDone ? `<button onclick="deleteRecommendation(${rec.applicationId})" class="text-gray-400 hover:text-red-500 hover:bg-red-50 p-2 rounded-lg transition-colors" title="刪除推薦信">
                                    <span class="material-symbols-outlined text-[20px]">delete</span>
                                </button>` : ''}
                            </td>
                        </tr>
                    `;
                }).join('');

            } catch (e) {
                console.error(e);
                loading.innerHTML = '<span class="text-red-500">載入失敗</span>';
            }
        }

        function openEditModal(appId, content) {
            document.getElementById('edit-modal').classList.remove('hidden');
            document.getElementById('edit-app-id').value = appId;
            document.getElementById('recommendation-content').value = content ? decodeURIComponent(content) : '';
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.add('hidden');
        }

        async function submitRecommendation() {
            const appId = document.getElementById('edit-app-id').value;
            const content = document.getElementById('recommendation-content').value;

            if (!content.trim()) {
                alert("請填寫內容");
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/recommendations/submit`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ applicationId: parseInt(appId), content: content })
                });

                if (!res.ok) throw new Error("Submit failed");

                alert("提交成功！");
                closeEditModal();
                loadRequests();
            } catch (e) {
                alert("提交失敗，請稍後再試");
            }
        }

        // 學生資料彈窗
        function openStudentModal(studentDataEncoded) {
            try {
                const student = JSON.parse(decodeURIComponent(studentDataEncoded));
                document.getElementById('student-modal').classList.remove('hidden');
                document.getElementById('student-avatar').textContent = (student.name || '?').charAt(0);
                document.getElementById('student-name').textContent = student.name || '未知學生';
                document.getElementById('student-department').textContent = student.department || '--';
                document.getElementById('student-grade').textContent = student.grade || '--';
                document.getElementById('student-email').textContent = student.email || '--';
                document.getElementById('student-phone').textContent = student.phone || '--';
            } catch (e) {
                console.error('Error parsing student data:', e);
            }
        }

        function closeStudentModal() {
            document.getElementById('student-modal').classList.add('hidden');
        }

        // 刪除推薦信
        async function deleteRecommendation(applicationId) {
            if (!confirm('確定要刪除此推薦信嗎？此操作無法復原。')) return;

            try {
                const res = await fetch(`${API_BASE}/recommendations/delete?applicationId=${applicationId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.ok) {
                    alert('推薦信已刪除');
                    loadRequests();
                } else {
                    const err = await res.json();
                    alert('刪除失敗：' + (err.error || '未知錯誤'));
                }
            } catch (e) {
                alert('無法連線到伺服器');
            }
        }
    </script>
</body>

</html>
