<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>學生管理 - 老師後台</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;700;900&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#4361EE",
                        secondary: "#707EAE",
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-[#F4F7FE] text-[#1B2559] font-sans antialiased">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-72 bg-white border-r border-gray-200 hidden lg:flex flex-col z-20">
            <div class="p-8 flex items-center gap-3">
                <div class="size-10 rounded-full bg-primary/10 flex items-center justify-center text-primary">
                    <span class="material-symbols-outlined">school</span>
                </div>
                <a href="#" id="logo-link"
                    class="font-bold text-xl tracking-tight hover:text-primary transition-colors">ScholarshipHub</a>
            </div>
            <nav class="flex-1 px-4 space-y-2">
                <a href="students.html"
                    class="flex items-center gap-3 px-4 py-3 rounded-xl bg-primary/5 text-primary font-bold transition-all">
                    <span class="material-symbols-outlined">groups</span>
                    學生管理
                </a>
                <a href="manage-recommendations.html"
                    class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-50 text-slate-500 font-medium transition-all">
                    <span class="material-symbols-outlined">history_edu</span>
                    推薦信管理
                </a>
                <a href="profile.html"
                    class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-50 text-slate-500 font-medium transition-all">
                    <span class="material-symbols-outlined">person</span>
                    個人資料
                </a>
            </nav>
            <div class="p-4 border-t">
                <button onclick="logout()"
                    class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-red-50 text-slate-500 hover:text-red-500 transition-all w-full">
                    <span class="material-symbols-outlined">logout</span>
                    登出
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col h-full overflow-hidden bg-[#F4F7FE]">
            <!-- Header -->
            <header
                class="bg-white/50 backdrop-blur-sm border-b border-white/50 sticky top-0 z-10 p-4 lg:p-8 flex justify-between items-center">
                <div>
                    <h2 class="text-2xl font-bold">學生管理</h2>
                    <p class="text-secondary text-sm">查看您所指導的學生資料</p>
                </div>
                <div class="flex items-center gap-4">
                    <div class="bg-white p-2 rounded-full shadow-sm">
                        <span class="material-symbols-outlined text-secondary">notifications</span>
                    </div>
                </div>
            </header>

            <!-- Content -->
            <div class="flex-1 overflow-y-auto p-4 lg:p-8">
                <!-- Stats Cards -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="bg-white rounded-[20px] p-6 shadow-sm">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-secondary text-sm font-medium">指導學生數</p>
                                <p id="student-count" class="text-3xl font-bold mt-1">--</p>
                            </div>
                            <div
                                class="size-14 rounded-full bg-primary/10 flex items-center justify-center text-primary">
                                <span class="material-symbols-outlined text-[28px]">groups</span>
                            </div>
                        </div>
                    </div>
                    <div class="bg-white rounded-[20px] p-6 shadow-sm">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-secondary text-sm font-medium">待處理推薦信</p>
                                <p id="pending-count" class="text-3xl font-bold mt-1">--</p>
                            </div>
                            <div
                                class="size-14 rounded-full bg-amber-100 flex items-center justify-center text-amber-600">
                                <span class="material-symbols-outlined text-[28px]">pending_actions</span>
                            </div>
                        </div>
                    </div>
                    <div class="bg-white rounded-[20px] p-6 shadow-sm">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-secondary text-sm font-medium">已完成推薦信</p>
                                <p id="completed-count" class="text-3xl font-bold mt-1">--</p>
                            </div>
                            <div
                                class="size-14 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-600">
                                <span class="material-symbols-outlined text-[28px]">task_alt</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Student List -->
                <div class="bg-white rounded-[20px] p-6 shadow-sm">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-lg font-bold">學生列表</h3>
                        <button onclick="loadStudents()"
                            class="text-primary hover:bg-primary/5 px-3 py-1 rounded-lg text-sm font-bold transition">重新整理</button>
                    </div>

                    <div id="loading" class="text-center py-10 text-secondary">載入中...</div>
                    <div id="empty-msg" class="hidden text-center py-10 text-secondary">
                        <span class="material-symbols-outlined text-6xl text-gray-300 mb-4">person_off</span>
                        <p>目前沒有指導學生</p>
                    </div>

                    <div id="student-grid" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        <!-- Student cards will be rendered here -->
                    </div>
                </div>
            </div>
        </main>
    </div>


    <script src="../../js/config.js"></script>
    <script>
        const API_BASE = CONFIG.API_BASE;
        const token = localStorage.getItem('authToken');

        document.addEventListener('DOMContentLoaded', () => {
            if (!token) {
                window.location.href = '../auth/login.html';
                return;
            }
            loadStudents();
            loadRecommendationStats();

            // Logo click - navigate to role-specific home
            document.getElementById('logo-link').addEventListener('click', (e) => {
                e.preventDefault();
                const userStr = localStorage.getItem('user');
                if (userStr) {
                    const user = JSON.parse(userStr);
                    const role = user.role?.toUpperCase();
                    if (role === 'STUDENT') {
                        window.location.href = '../student/profile.html';
                    } else if (role === 'ADMIN') {
                        window.location.href = '../scholarship/list.html';
                    } else if (role === 'REVIEWER') {
                        window.location.href = '../reviewer/dashboard.html';
                    } else if (role === 'TEACHER' || role === 'ADVISOR') {
                        window.location.href = 'manage-recommendations.html';
                    } else {
                        window.location.href = '../../index.html';
                    }
                } else {
                    window.location.href = '../../index.html';
                }
            });
        });

        function logout() {
            localStorage.removeItem('authToken');
            window.location.href = '../auth/login.html';
        }

        async function loadStudents() {
            const grid = document.getElementById('student-grid');
            const loading = document.getElementById('loading');
            const empty = document.getElementById('empty-msg');

            grid.innerHTML = '';
            grid.classList.add('hidden');
            loading.classList.remove('hidden');
            empty.classList.add('hidden');

            try {
                const res = await fetch(`${API_BASE}/students/advisor`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!res.ok) throw new Error("Failed to fetch students");

                const students = await res.json();
                loading.classList.add('hidden');

                document.getElementById('student-count').textContent = students.length;

                if (students.length === 0) {
                    empty.classList.remove('hidden');
                    return;
                }

                grid.classList.remove('hidden');
                grid.innerHTML = students.map(student => {
                    const name = student.user?.name || '未知';
                    const email = student.user?.email || '--';
                    const department = student.department || '未設定';
                    const grade = student.grade || '--';
                    const initial = name.charAt(0).toUpperCase();

                    return `
                        <div class="bg-gradient-to-br from-slate-50 to-white rounded-2xl p-6 border border-gray-100 hover:shadow-lg transition-all duration-300 cursor-pointer group"
                             onclick="viewStudent(${student.userId})">
                            <div class="flex items-start gap-4">
                                <div class="size-14 rounded-2xl bg-gradient-to-br from-primary to-indigo-600 text-white flex items-center justify-center font-bold text-xl shadow-lg shadow-primary/30">
                                    ${initial}
                                </div>
                                <div class="flex-1 min-w-0">
                                    <h4 class="font-bold text-lg text-slate-800 group-hover:text-primary transition-colors">${name}</h4>
                                    <p class="text-secondary text-sm truncate">${email}</p>
                                </div>
                            </div>
                            <div class="mt-4 pt-4 border-t border-gray-100 grid grid-cols-2 gap-3">
                                <div class="flex items-center gap-2">
                                    <span class="material-symbols-outlined text-secondary text-[18px]">apartment</span>
                                    <span class="text-sm font-medium text-slate-600">${department}</span>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="material-symbols-outlined text-secondary text-[18px]">school</span>
                                    <span class="text-sm font-medium text-slate-600">${grade}</span>
                                </div>
                            </div>
                            <div class="mt-4 flex justify-end">
                                <span class="text-primary text-sm font-bold flex items-center gap-1 group-hover:gap-2 transition-all">
                                    查看詳情
                                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
                                </span>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (e) {
                console.error(e);
                loading.innerHTML = '<span class="text-red-500">載入失敗，請稍後再試</span>';
            }
        }

        async function loadRecommendationStats() {
            try {
                const res = await fetch(`${API_BASE}/recommendations/advisor`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!res.ok) return;

                const recs = await res.json();
                const pending = recs.filter(r => !r.content).length;
                const completed = recs.filter(r => r.content).length;

                document.getElementById('pending-count').textContent = pending;
                document.getElementById('completed-count').textContent = completed;
            } catch (e) {
                console.error(e);
            }
        }

        function viewStudent(studentId) {
            window.location.href = `student-detail.html?id=${studentId}`;
        }
    </script>
</body>

</html>
