<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>新增獎助單位 - ScholarshipHub</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&amp;family=Noto+Sans+TC:wght@300;400;500;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4F46E5",
                        "primary-dark": "#4338ca",
                        "background-light": "#F8FAFC",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Lexend", "Noto Sans TC", "sans-serif"],
                        "body": ["Noto Sans TC", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
</head>

<body
    class="bg-background-light dark:bg-background-dark text-[#0f172a] dark:text-white font-display min-h-screen flex flex-col overflow-x-hidden transition-colors duration-300">
    <header
        class="sticky top-0 z-50 w-full border-b border-gray-200 bg-white/80 backdrop-blur-md dark:bg-[#1a202c] dark:border-gray-700 shadow-sm">
        <div class="mx-auto flex h-16 max-w-[1440px] items-center justify-between px-4 sm:px-6 lg:px-8">
            <a href="../scholarship/list.html" class="flex items-center gap-4 cursor-pointer">
                <div class="flex items-center justify-center size-9 rounded-xl bg-primary/10 text-primary shadow-sm">
                    <span class="material-symbols-outlined text-[24px]">school</span>
                </div>
                <h1 class="text-xl font-bold tracking-tight text-[#0f172a] dark:text-white">ScholarshipHub</h1>
            </a>
            <div class="hidden md:flex flex-1 justify-end items-center gap-8">
                <nav class="flex items-center gap-6">
                    <a class="text-sm font-medium text-slate-500 hover:text-primary transition-colors"
                        href="../scholarship/list.html">獎學金管理</a>
                    <a class="text-sm font-medium text-slate-500 hover:text-primary transition-colors"
                        href="../announcement/manage.html">公告管理</a>
                    <a class="text-sm font-medium text-[#0f172a] dark:text-white hover:text-primary transition-colors"
                        href="list.html">獎助單位</a>
                </nav>
                <div class="flex items-center gap-3 pl-6 border-l border-gray-200 dark:border-gray-700">
                    <div class="flex flex-col items-end">
                        <span id="user-name" class="text-sm font-semibold">載入中...</span>
                        <span id="user-role" class="text-xs text-slate-500">管理員</span>
                    </div>
                    <div class="h-10 w-10 rounded-full bg-gray-100 flex items-center justify-center">
                        <span class="material-symbols-outlined">person</span>
                    </div>
                    <button id="logout-btn" class="text-slate-400 hover:text-red-500">
                        <span class="material-symbols-outlined">logout</span>
                    </button>
                </div>
            </div>
            <button class="md:hidden p-2 text-gray-500">
                <span class="material-symbols-outlined">menu</span>
            </button>
        </div>
    </header>

    <main class="flex-1 w-full max-w-[800px] mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex items-center gap-2 mb-6 text-sm">
            <a class="text-slate-500 hover:text-primary font-medium" href="list.html">獎助單位管理</a>
            <span class="text-slate-300 material-symbols-outlined text-[16px]">chevron_right</span>
            <span class="text-[#0f172a] dark:text-white font-semibold">新增獎助單位</span>
        </div>

        <div class="bg-white dark:bg-[#1a202c] rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 p-8">
            <div class="flex items-center gap-3 mb-8 pb-4 border-b border-gray-100 dark:border-gray-700">
                <div class="p-2 bg-primary/10 rounded-lg text-primary">
                    <span class="material-symbols-outlined text-[24px]">add_business</span>
                </div>
                <div>
                    <h2 class="text-2xl font-bold text-[#0f172a] dark:text-white">新增獎助單位</h2>
                    <p class="text-slate-500 text-sm">填寫詳細資訊以建立新的獎助單位</p>
                </div>
            </div>

            <form id="createSponsorUnitForm" class="space-y-6">
                <!-- Unit Name -->
                <div>
                    <label for="unitName" class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">單位名稱
                        <span class="text-red-500">*</span></label>
                    <input type="text" id="unitName" required
                        class="w-full rounded-xl border-gray-300 dark:border-gray-600 bg-slate-50 dark:bg-gray-800 text-sm focus:border-primary focus:ring-primary py-3 px-4 shadow-sm"
                        placeholder="例如：教育部">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Contact Person -->
                    <div>
                        <label for="contactPerson"
                            class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">聯絡人</label>
                        <input type="text" id="contactPerson"
                            class="w-full rounded-xl border-gray-300 dark:border-gray-600 bg-slate-50 dark:bg-gray-800 text-sm focus:border-primary focus:ring-primary py-3 px-4 shadow-sm"
                            placeholder="例如：王小明">
                    </div>
                    <!-- Phone -->
                    <div>
                        <label for="phone"
                            class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">電話</label>
                        <input type="tel" id="phone"
                            class="w-full rounded-xl border-gray-300 dark:border-gray-600 bg-slate-50 dark:bg-gray-800 text-sm focus:border-primary focus:ring-primary py-3 px-4 shadow-sm"
                            placeholder="例如：02-12345678">
                    </div>
                </div>

                <!-- Email -->
                <div>
                    <label for="email"
                        class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">電子郵件</label>
                    <input type="email" id="email"
                        class="w-full rounded-xl border-gray-300 dark:border-gray-600 bg-slate-50 dark:bg-gray-800 text-sm focus:border-primary focus:ring-primary py-3 px-4 shadow-sm"
                        placeholder="例如：contact@example.com">
                </div>

                <!-- Address -->
                <div>
                    <label for="address"
                        class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">地址</label>
                    <input type="text" id="address"
                        class="w-full rounded-xl border-gray-300 dark:border-gray-600 bg-slate-50 dark:bg-gray-800 text-sm focus:border-primary focus:ring-primary py-3 px-4 shadow-sm"
                        placeholder="例如：台北市中正區中山南路5號">
                </div>

                <!-- Website -->
                <div>
                    <label for="website"
                        class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">網站</label>
                    <input type="url" id="website"
                        class="w-full rounded-xl border-gray-300 dark:border-gray-600 bg-slate-50 dark:bg-gray-800 text-sm focus:border-primary focus:ring-primary py-3 px-4 shadow-sm"
                        placeholder="例如：https://www.example.com">
                </div>

                <div
                    class="flex items-center justify-end gap-4 pt-6 mt-6 border-t border-gray-100 dark:border-gray-700">
                    <a href="list.html"
                        class="px-6 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 font-bold text-sm hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
                        取消
                    </a>
                    <button type="submit"
                        class="px-6 py-2.5 rounded-xl bg-primary hover:bg-primary-dark text-white font-bold text-sm shadow-lg shadow-primary/30 transition-all active:scale-95 flex items-center gap-2">
                        <span class="material-symbols-outlined text-[20px]">save</span>
                        儲存
                    </button>
                </div>
            </form>
        </div>
    </main>


    <script src="../../js/config.js"></script>
    <script>
        const API_BASE = CONFIG.API_BASE;

        function checkAdmin() {
            const token = localStorage.getItem('authToken');
            const userStr = localStorage.getItem('user');

            if (!token || !userStr) {
                alert('請先登入');
                window.location.href = '../auth/login.html';
                return null;
            }

            try {
                const user = JSON.parse(userStr);
                if (user.role && user.role.toUpperCase() !== 'ADMIN') {
                    alert('權限不足：僅管理員可存取此頁面');
                    window.location.href = 'list.html';
                    return null;
                }
                return token;
            } catch (e) {
                console.error(e);
                window.location.href = '../auth/login.html';
                return null;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const token = checkAdmin();
            if (!token) return;

            const form = document.getElementById('createSponsorUnitForm');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const submitBtn = form.querySelector('button[type="submit"]');
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> 處理中...';

                const data = {
                    unitName: document.getElementById('unitName').value,
                    contactPerson: document.getElementById('contactPerson').value || null,
                    phone: document.getElementById('phone').value || null,
                    email: document.getElementById('email').value || null,
                    address: document.getElementById('address').value || null,
                    website: document.getElementById('website').value || null
                };

                console.log("Submitting data:", data);

                try {
                    const response = await fetch(`${API_BASE}/sponsor-units`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify(data)
                    });

                    if (response.ok) {
                        alert('獎助單位已成功新增！');
                        window.location.href = 'list.html';
                    } else {
                        const errorText = await response.text();
                        console.error("Submission failed:", response.status, errorText);
                        try {
                            const errorJson = JSON.parse(errorText);
                            alert('新增失敗: ' + (errorJson.message || '未知錯誤'));
                        } catch (e) {
                            alert('新增失敗 (Status ' + response.status + '): ' + errorText);
                        }
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('發生錯誤，請稍後再試');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span class="material-symbols-outlined text-[20px]">save</span> 儲存';
                }
            });
        });
    </script>
</body>

</html>
