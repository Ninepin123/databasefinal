<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>編輯獎學金 - ScholarshipHub</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&amp;family=Noto+Sans+TC:wght@300;400;500;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4F46E5",
                        "primary-dark": "#4338ca",
                        "background-light": "#F8FAFC",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Lexend", "Noto Sans TC", "sans-serif"],
                        "body": ["Noto Sans TC", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
</head>

<body
    class="bg-background-light dark:bg-background-dark text-[#0f172a] dark:text-white font-display min-h-screen flex flex-col overflow-x-hidden transition-colors duration-300">
    <header
        class="sticky top-0 z-50 w-full border-b border-gray-200 bg-white/80 backdrop-blur-md dark:bg-[#1a202c] dark:border-gray-700 shadow-sm">
        <div class="mx-auto flex h-16 max-w-[1440px] items-center justify-between px-4 sm:px-6 lg:px-8">
            <a href="list.html" class="flex items-center gap-4 cursor-pointer">
                <div class="flex items-center justify-center size-9 rounded-xl bg-primary/10 text-primary shadow-sm">
                    <span class="material-symbols-outlined text-[24px]">school</span>
                </div>
                <h1 class="text-xl font-bold tracking-tight text-[#0f172a] dark:text-white">ScholarshipHub</h1>
            </a>
            <div class="hidden md:flex flex-1 justify-end items-center gap-8">
                <nav class="flex items-center gap-6">
                    <a class="text-sm font-medium text-[#0f172a] dark:text-white hover:text-primary transition-colors"
                        href="list.html">獎學金管理</a>
                    <a class="text-sm font-medium text-slate-500 hover:text-primary transition-colors"
                        href="../announcement/manage.html">公告管理</a>
                    <a class="text-sm font-medium text-slate-500 hover:text-primary transition-colors"
                        href="../sponsor-unit/list.html">獎助單位</a>
                </nav>
                <div class="flex items-center gap-3 pl-6 border-l border-gray-200 dark:border-gray-700">
                    <div class="flex flex-col items-end">
                        <span id="user-name" class="text-sm font-semibold">載入中...</span>
                        <span id="user-role" class="text-xs text-slate-500">管理員</span>
                    </div>
                    <div class="h-10 w-10 rounded-full bg-gray-100 flex items-center justify-center">
                        <span class="material-symbols-outlined">person</span>
                    </div>
                    <button id="logout-btn" class="text-slate-400 hover:text-red-500">
                        <span class="material-symbols-outlined">logout</span>
                    </button>
                </div>
            </div>
            <button class="md:hidden p-2 text-gray-500">
                <span class="material-symbols-outlined">menu</span>
            </button>
        </div>
    </header>

    <main class="flex-1 w-full max-w-[800px] mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex items-center gap-2 mb-6 text-sm">
            <a class="text-slate-500 hover:text-primary font-medium" href="list.html">獎學金列表</a>
            <span class="text-slate-300 material-symbols-outlined text-[16px]">chevron_right</span>
            <span class="text-[#0f172a] dark:text-white font-semibold">編輯獎學金</span>
        </div>

        <div class="bg-white dark:bg-[#1a202c] rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 p-8">
            <div class="flex items-center gap-3 mb-8 pb-4 border-b border-gray-100 dark:border-gray-700">
                <div class="p-2 bg-primary/10 rounded-lg text-primary">
                    <span class="material-symbols-outlined text-[24px]">edit</span>
                </div>
                <div>
                    <h2 class="text-2xl font-bold text-[#0f172a] dark:text-white">編輯獎學金</h2>
                    <p class="text-slate-500 text-sm">修改獎學金的詳細資訊</p>
                </div>
            </div>

            <form id="editScholarshipForm" class="space-y-6">
                <!-- Name -->
                <div>
                    <label for="name"
                        class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">獎學金名稱</label>
                    <input type="text" id="name" required
                        class="w-full rounded-xl border-gray-300 dark:border-gray-600 bg-slate-50 dark:bg-gray-800 text-sm focus:border-primary focus:ring-primary py-3 px-4 shadow-sm"
                        placeholder="例如：112學年度優秀清寒學生獎學金">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="amount" class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">金額
                            (NT$)</label>
                        <input type="number" id="amount" required min="0" step="1000"
                            class="w-full rounded-xl border-gray-300 dark:border-gray-600 bg-slate-50 dark:bg-gray-800 text-sm focus:border-primary focus:ring-primary py-3 px-4 shadow-sm"
                            placeholder="50000">
                    </div>
                    <div>
                        <label for="quota"
                            class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">名額</label>
                        <input type="number" id="quota" required min="1"
                            class="w-full rounded-xl border-gray-300 dark:border-gray-600 bg-slate-50 dark:bg-gray-800 text-sm focus:border-primary focus:ring-primary py-3 px-4 shadow-sm"
                            placeholder="10">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Type -->
                    <div>
                        <label for="type"
                            class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">類型</label>
                        <select id="type" required
                            class="w-full rounded-xl border-gray-300 dark:border-gray-600 bg-slate-50 dark:bg-gray-800 text-sm focus:border-primary focus:ring-primary py-3 px-4 shadow-sm">
                            <option value="Merit-based">優秀獎學金 (Merit-based)</option>
                            <option value="Need-based">清寒助學金 (Need-based)</option>
                            <option value="Sports">體育獎學金 (Sports)</option>
                            <option value="Exchange">交換學生補助 (Exchange)</option>
                            <option value="Other">其他</option>
                        </select>
                    </div>
                    <!-- Date -->
                    <div>
                        <label for="deadline"
                            class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">申請截止日</label>
                        <input type="datetime-local" id="deadline" required
                            class="w-full rounded-xl border-gray-300 dark:border-gray-600 bg-slate-50 dark:bg-gray-800 text-sm focus:border-primary focus:ring-primary py-3 px-4 shadow-sm">
                    </div>
                </div>

                <!-- Description -->
                <div>
                    <label for="description"
                        class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">詳細說明</label>
                    <textarea id="description" rows="4" required
                        class="w-full rounded-xl border-gray-300 dark:border-gray-600 bg-slate-50 dark:bg-gray-800 text-sm focus:border-primary focus:ring-primary py-3 px-4 shadow-sm"
                        placeholder="請輸入獎學金的詳細說明、申請資格等..."></textarea>
                </div>

                <!-- Conditions -->
                <div>
                    <label for="conditions" class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">申請條件
                        (Conditions)</label>
                    <textarea id="conditions" rows="3" required
                        class="w-full rounded-xl border-gray-300 dark:border-gray-600 bg-slate-50 dark:bg-gray-800 text-sm focus:border-primary focus:ring-primary py-3 px-4 shadow-sm"
                        placeholder="例如：學業成績平均 80 分以上..."></textarea>
                </div>

                <!-- Sponsor Unit -->
                <div>
                    <label for="unitId" class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">獎助單位 <span
                            class="text-red-500">*</span></label>
                    <select id="unitId" required
                        class="w-full rounded-xl border-gray-300 dark:border-gray-600 bg-slate-50 dark:bg-gray-800 text-sm focus:border-primary focus:ring-primary py-3 px-4 shadow-sm">
                        <option value="">載入中...</option>
                    </select>
                    <p class="mt-1 text-xs text-slate-400">選擇提供此獎學金的單位，若無適合選項請先<a href="../sponsor-unit/add.html"
                            class="text-primary hover:underline">新增獎助單位</a></p>
                </div>

                <div
                    class="flex items-center justify-end gap-4 pt-6 mt-6 border-t border-gray-100 dark:border-gray-700">
                    <a href="list.html"
                        class="px-6 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 font-bold text-sm hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
                        取消
                    </a>
                    <button type="submit"
                        class="px-6 py-2.5 rounded-xl bg-primary hover:bg-primary-dark text-white font-bold text-sm shadow-lg shadow-primary/30 transition-all active:scale-95 flex items-center gap-2">
                        <span class="material-symbols-outlined text-[20px]">save</span>
                        儲存變更
                    </button>
                </div>
            </form>
        </div>
    </main>


    <script src="../../js/config.js"></script>
    <script>
        const API_BASE = CONFIG.API_BASE;

        function checkAdmin() {
            const token = localStorage.getItem('authToken');
            const userStr = localStorage.getItem('user');

            if (!token || !userStr) {
                alert('請先登入');
                window.location.href = '../auth/login.html';
                return null;
            }

            try {
                const user = JSON.parse(userStr);
                if (user.role && user.role.toUpperCase() !== 'ADMIN') {
                    alert('權限不足：僅管理員可存取此頁面');
                    window.location.href = 'list.html';
                    return null;
                }
                return token;
            } catch (e) {
                console.error(e);
                window.location.href = '../auth/login.html';
            }
        }

        function getScholarshipIdFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        function formatDateTimeForInput(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            return date.toISOString().slice(0, 16);
        }

        function formatToLocalDateTime(dateStr) {
            if (!dateStr) return null;
            if (dateStr.length === 16) return dateStr + ':00';
            return new Date(dateStr).toISOString().slice(0, 19);
        }

        // Load sponsor units for dropdown
        async function loadSponsorUnits(selectedUnitId = null) {
            const select = document.getElementById('unitId');
            try {
                const response = await fetch(`${API_BASE}/sponsor-units`);
                if (!response.ok) throw new Error('Failed to load sponsor units');

                const units = await response.json();
                select.innerHTML = '<option value="">-- 請選擇獎助單位 --</option>';

                if (units.length === 0) {
                    select.innerHTML = '<option value="">尚無獎助單位，請先新增</option>';
                    return;
                }

                units.forEach(unit => {
                    const option = document.createElement('option');
                    option.value = unit.unitId;
                    option.textContent = unit.unitName;
                    if (selectedUnitId && unit.unitId === selectedUnitId) {
                        option.selected = true;
                    }
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading sponsor units:', error);
                select.innerHTML = '<option value="">載入失敗</option>';
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const token = checkAdmin();
            if (!token) return;

            // Admin Nav Links
            const userStr = localStorage.getItem('user');
            if (userStr) {
                try {
                    const user = JSON.parse(userStr);
                    if (user.role === 'ADMIN') {
                        const nav = document.querySelector('nav');
                        if (nav) {
                            const adminLink = document.createElement('a');
                            adminLink.className = 'text-sm font-medium text-slate-500 hover:text-primary transition-colors';
                            adminLink.href = 'add.html';
                            adminLink.innerHTML = '<span class="flex items-center gap-1 text-primary"><span class="material-symbols-outlined text-[18px]">add_circle</span>發布獎學金</span>';
                            nav.appendChild(adminLink);

                            const sponsorUnitLink = document.createElement('a');
                            sponsorUnitLink.className = 'text-sm font-medium text-slate-500 hover:text-primary transition-colors';
                            sponsorUnitLink.href = '../sponsor-unit/list.html';
                            sponsorUnitLink.innerHTML = '<span class="flex items-center gap-1 text-primary"><span class="material-symbols-outlined text-[18px]">business</span>獎助單位</span>';
                            nav.appendChild(sponsorUnitLink);
                        }
                    }
                } catch (e) { console.error(e); }
            }

            const scholarshipId = getScholarshipIdFromUrl();
            if (!scholarshipId) {
                alert('缺少獎學金 ID');
                window.location.href = 'list.html';
                return;
            }

            // Load existing scholarship data
            try {
                const response = await fetch(`${API_BASE}/scholarships/${scholarshipId}`);
                if (!response.ok) {
                    throw new Error('獎學金不存在');
                }
                const scholarship = await response.json();

                // Populate form fields
                document.getElementById('name').value = scholarship.name || '';
                document.getElementById('amount').value = scholarship.amount || '';
                document.getElementById('quota').value = scholarship.quota || '';
                document.getElementById('type').value = scholarship.type || 'Merit-based';
                document.getElementById('deadline').value = formatDateTimeForInput(scholarship.deadline);
                document.getElementById('description').value = scholarship.description || '';
                document.getElementById('conditions').value = scholarship.conditions || '';

                // Load sponsor units and select current one
                await loadSponsorUnits(scholarship.unitId);

            } catch (error) {
                console.error('Error loading scholarship:', error);
                alert('無法載入獎學金資料');
                window.location.href = 'list.html';
                return;
            }

            // Handle form submission
            const form = document.getElementById('editScholarshipForm');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const submitBtn = form.querySelector('button[type="submit"]');
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> 處理中...';

                const unitIdValue = document.getElementById('unitId').value;
                if (!unitIdValue) {
                    alert('請選擇獎助單位');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span class="material-symbols-outlined text-[20px]">save</span> 儲存變更';
                    return;
                }

                const data = {
                    name: document.getElementById('name').value,
                    amount: parseFloat(document.getElementById('amount').value),
                    quota: parseInt(document.getElementById('quota').value),
                    type: document.getElementById('type').value,
                    deadline: formatToLocalDateTime(document.getElementById('deadline').value),
                    description: document.getElementById('description').value,
                    conditions: document.getElementById('conditions').value,
                    startDate: new Date().toISOString().slice(0, 19),
                    unitId: parseInt(unitIdValue)
                };

                try {
                    const response = await fetch(`${API_BASE}/scholarships/${scholarshipId}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify(data)
                    });

                    if (response.ok) {
                        alert('獎學金已成功更新！');
                        window.location.href = 'list.html';
                    } else {
                        const errorText = await response.text();
                        console.error("Update failed:", response.status, errorText);
                        try {
                            const errorJson = JSON.parse(errorText);
                            alert('更新失敗: ' + (errorJson.message || '未知錯誤'));
                        } catch (e) {
                            alert('更新失敗 (Status ' + response.status + '): ' + errorText);
                        }
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('發生錯誤，請稍後再試');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span class="material-symbols-outlined text-[20px]">save</span> 儲存變更';
                }
            });
        });
    </script>
</body>

</html>
