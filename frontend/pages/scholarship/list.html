<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>獎學金列表 | Scholarship Hub</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&amp;family=Noto+Sans+TC:wght@300;400;500;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4F46E5",
                        "primary-dark": "#4338ca",
                        "background-light": "#F8FAFC",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Lexend", "Noto Sans TC", "sans-serif"],
                        "body": ["Noto Sans TC", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
</head>
<style type="text/tailwindcss">
    @layer components {
            .nav-link {
                @apply text-slate-500 hover:text-primary transition-colors font-medium relative py-1;
            }
            .nav-link:hover {
                @apply text-primary;
            }
            .nav-link-active {
                @apply text-primary font-bold relative py-1;
            }
            .nav-link-active::after {
                content: '';
                @apply absolute bottom-[-21px] left-0 w-full h-[3px] bg-primary rounded-t-full shadow-[0_-2px_6px_rgba(79,70,229,0.3)];
                view-transition-name: nav-indicator; 
            }
        }
    </style>

<body
    class="bg-background-light dark:bg-background-dark text-[#0f172a] dark:text-white font-display min-h-screen flex flex-col overflow-x-hidden transition-colors duration-300">

    <header
        class="sticky top-0 z-50 w-full border-b border-gray-200 bg-white/80 backdrop-blur-md dark:bg-[#1a202c] dark:border-gray-700 shadow-sm">
        <div class="mx-auto flex h-16 max-w-[1440px] items-center justify-between px-4 sm:px-6 lg:px-8">
            <a href="#" id="logo-link" class="flex items-center gap-4">
                <div class="flex items-center justify-center size-9 rounded-xl bg-primary/10 text-primary shadow-sm">
                    <span class="material-symbols-outlined">school</span>
                </div>
                <h1 class="text-xl font-bold">ScholarshipHub</h1>
            </a>

            <div class="hidden md:flex flex-1 justify-end items-center gap-8">
                <nav id="main-nav" class="flex gap-6 opacity-0 transition-opacity duration-150">
                    <a href="list.html" class="nav-link-active">獎學金列表</a>
                    <a href="../announcement/list.html" class="nav-link">公告</a>
                    <a href="../student/applications.html" class="nav-link" id="nav-my-applications">我的申請</a>
                </nav>

                <div class="flex items-center gap-3 pl-6 border-l border-gray-200 dark:border-gray-700">
                    <!-- Notification Bell (Students Only) -->
                    <a href="../student/notifications.html" id="notification-bell"
                        class="relative p-2 rounded-lg hover:bg-primary/10 text-slate-500 hover:text-primary transition-colors hidden"
                        data-student-only>
                        <span class="material-symbols-outlined">notifications</span>
                        <span id="nav-notification-badge"
                            class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold rounded-full size-5 items-center justify-center">0</span>
                    </a>
                    <div class="flex flex-col items-end">
                        <span id="user-name" class="text-sm font-semibold">載入中...</span>
                        <span id="user-role" class="text-xs text-slate-500">...</span>
                    </div>
                    <a href="../student/profile.html" id="user-avatar"
                        class="h-10 w-10 rounded-full bg-gray-100 flex items-center justify-center hover:ring-2 hover:ring-primary/50 transition-all cursor-pointer"
                        title="個人檔案">
                        <span class="material-symbols-outlined">person</span>
                    </a>
                    <button id="logout-btn" class="text-slate-400 hover:text-red-500">
                        <span class="material-symbols-outlined">logout</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 w-full max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
            <h2 class="text-4xl font-black">可申請獎學金</h2>
            <div class="w-full md:w-96 relative group">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <span
                        class="material-symbols-outlined text-gray-400 group-focus-within:text-primary transition-colors">search</span>
                </div>
                <input type="text" id="search-input" placeholder="搜尋獎學金名稱或關鍵字..."
                    class="w-full rounded-xl border border-gray-200 bg-gray-50 py-3 pl-10 pr-4 text-sm placeholder-gray-400 focus:border-primary focus:bg-white focus:outline-none focus:ring-4 focus:ring-primary/10 transition-all shadow-sm">
            </div>
        </div>
        <div id="scholarship-container" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6"></div>
    </main>

    <footer class="border-t border-gray-200 dark:border-gray-700 py-6 text-center text-sm text-slate-400">
        © 2026 Scholarship Hub. All rights reserved.
    </footer>


    <script src="../../js/config.js"></script>
    <script>
        const API_BASE = CONFIG.API_BASE;

        document.addEventListener("DOMContentLoaded", async () => {
            const token = localStorage.getItem("authToken");
            if (!token) return location.href = "../auth/login.html";

            document.getElementById("logout-btn").onclick = () => {
                localStorage.clear();
                location.href = "../auth/login.html";
            };

            // 讀取使用者資料
            try {
                const profileRes = await fetch(`${API_BASE}/profile`, {
                    headers: { Authorization: `Bearer ${token}` }
                });

                if (profileRes.ok) {
                    const profile = await profileRes.json();
                    console.log("Loaded profile:", profile);

                    document.getElementById("user-name").textContent = profile.name || "未知使用者";

                    const roleMap = { STUDENT: "學生", TEACHER: "導師", ADMIN: "管理員" };
                    const roleText = roleMap[profile.role] || profile.role || "一般使用者";
                    document.getElementById("user-role").textContent = roleText;
                } else {
                    console.warn("Profile fetch failed:", profileRes.status);
                    // Fallback to localStorage if API fails
                    const userStr = localStorage.getItem('user');
                    if (userStr) {
                        const user = JSON.parse(userStr);
                        document.getElementById("user-name").textContent = user.name;
                        const roleMap = { STUDENT: "學生", TEACHER: "導師", ADMIN: "管理員" };
                        document.getElementById("user-role").textContent = roleMap[user.role] || user.role;
                    }
                }
            } catch (e) {
                console.error("Failed to load profile:", e);
                document.getElementById("user-name").textContent = "讀取失敗";
            }

            // Show notification bell for students and load count
            const userStr2 = localStorage.getItem('user');
            if (userStr2) {
                try {
                    const user = JSON.parse(userStr2);
                    if (user.role === 'STUDENT') {
                        const bell = document.getElementById('notification-bell');
                        if (bell) {
                            bell.classList.remove('hidden');
                        }
                        // Load notification count
                        try {
                            const countRes = await fetch(`${API_BASE}/notifications/unread-count`, {
                                headers: { 'Authorization': `Bearer ${token}` }
                            });
                            if (countRes.ok) {
                                const data = await countRes.json();
                                const badge = document.getElementById('nav-notification-badge');
                                if (badge && data.count > 0) {
                                    badge.textContent = data.count > 99 ? '99+' : data.count;
                                    badge.classList.remove('hidden');
                                    badge.classList.add('flex');
                                }
                            }
                        } catch (err) {
                            console.error('Failed to load notification count:', err);
                        }
                    }
                } catch (e) { }
            }

            // Logo click - navigate to role-specific home
            document.getElementById('logo-link').addEventListener('click', (e) => {
                e.preventDefault();
                const userStr3 = localStorage.getItem('user');
                if (userStr3) {
                    const user = JSON.parse(userStr3);
                    const role = user.role?.toUpperCase();
                    if (role === 'STUDENT') {
                        window.location.href = '../student/profile.html';
                    } else if (role === 'ADMIN') {
                        window.location.href = 'list.html';
                    } else if (role === 'REVIEWER') {
                        window.location.href = '../reviewer/dashboard.html';
                    } else if (role === 'TEACHER' || role === 'ADVISOR') {
                        window.location.href = '../teacher/manage-recommendations.html';
                    } else {
                        window.location.href = '../../index.html';
                    }
                } else {
                    window.location.href = '../../index.html';
                }
            });

            // NOTE: Scholarship fetching removed from here as it duplicates the logic in the script below
        });
    </script>
</body>

<script>
    function checkIsAdmin() {
        const userStr = localStorage.getItem('user');
        if (userStr) {
            try {
                const user = JSON.parse(userStr);
                return user.role && user.role.toUpperCase() === 'ADMIN';
            } catch (e) {
                return false;
            }
        }
        return false;
    }

    async function deleteScholarship(id, name) {
        if (!confirm(`確定要刪除獎學金「${name}」嗎？\n\n此操作無法復原，相關申請資料也會被移除。`)) {
            return;
        }

        const token = localStorage.getItem('authToken');
        try {
            const response = await fetch(`${API_BASE}/scholarships/${id}`, {
                method: 'DELETE',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (response.ok) {
                alert('獎學金已成功刪除！');
                location.reload();
            } else {
                const errorText = await response.text();
                alert('刪除失敗: ' + errorText);
            }
        } catch (error) {
            console.error('Error:', error);
            alert('網路錯誤，請稍後再試');
        }
    }

    document.addEventListener('DOMContentLoaded', async () => {
        const container = document.getElementById('scholarship-container');
        const searchInput = document.getElementById('search-input');

        // Initial load
        loadScholarships();

        // Search functionality with debounce
        let debounceTimer;
        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    loadScholarships(e.target.value);
                }, 300);
            });
        }

        async function loadScholarships(keyword = '') {
            try {
                let url = `${API_BASE}/scholarships`;
                if (keyword) {
                    url += `?keyword=${encodeURIComponent(keyword)}`;
                }

                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const scholarships = await response.json();

                container.innerHTML = ''; // Clear loading or existing content

                if (scholarships.length === 0) {
                    container.innerHTML = '<div class="col-span-full text-center py-10"><p class="text-slate-500 text-lg">沒有找到符合條件的獎學金</p></div>';
                    return;
                }

                const isAdmin = checkIsAdmin();
                scholarships.forEach(scholarship => {
                    const card = createScholarshipCard(scholarship, isAdmin);
                    container.appendChild(card);
                });
            } catch (error) {
                console.error('Error fetching scholarships:', error);
                container.innerHTML = '<p class="text-red-500">無法載入獎學金資料，請稍後再試。</p>';
            }
        }

        // Check for Admin Role and update UI
        const userStr = localStorage.getItem('user');
        const nav = document.getElementById('main-nav');

        if (userStr) {
            try {
                const user = JSON.parse(userStr);
                const role = user.role?.toUpperCase();

                // 教師/導師角色：新增推薦信管理連結
                if (role === 'ADVISOR' || role === 'TEACHER') {
                    if (nav) {
                        const advisorLink = document.createElement('a');
                        advisorLink.className = 'nav-link';
                        advisorLink.href = '../teacher/manage-recommendations.html';
                        advisorLink.innerHTML = '<span class="flex items-center gap-1 text-primary"><span class="material-symbols-outlined text-[18px]">history_edu</span>推薦信管理</span>';
                        nav.appendChild(advisorLink);
                    }
                }

                // 管理員角色 - 完全替換導航列
                if (role === 'ADMIN') {
                    if (nav) {
                        nav.innerHTML = `
                            <a href="list.html" class="nav-link-active">獎學金管理</a>
                            <a href="../announcement/manage.html" class="nav-link">公告管理</a>
                            <a href="../sponsor-unit/list.html" class="nav-link">獎助單位</a>
                        `;
                    }

                    // 更新頁面標題
                    const pageTitle = document.querySelector('h2.text-4xl');
                    if (pageTitle) {
                        pageTitle.textContent = '獎學金管理';
                    }

                    // Update user role display
                    const userRoleEl = document.getElementById('user-role');
                    if (userRoleEl) {
                        userRoleEl.textContent = '管理員';
                    }

                    // Hide notification bell (admin doesn't need it)
                    const bell = document.getElementById('notification-bell');
                    if (bell) bell.style.display = 'none';
                }
            } catch (e) {
                console.error('Error parsing user data', e);
            }
        }

        // 顯示導航列（移除 opacity-0）
        if (nav) {
            nav.classList.remove('opacity-0');
            nav.classList.add('opacity-100');
        }
    });

    function createScholarshipCard(scholarship, isAdmin = false) {
        const article = document.createElement('article');
        article.className = 'group flex flex-col bg-white dark:bg-[#1a202c] rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden hover:shadow-xl hover:-translate-y-1 transition-all duration-300';

        const deadline = new Date(scholarship.deadline);
        const now = new Date();
        const timeLeft = Math.ceil((deadline - now) / (1000 * 60 * 60 * 24));
        const isClosed = timeLeft < 0;

        let statusBadge = '';
        let statusIcon = '';
        let deadlineText = '';
        let adminButtons = '';

        if (isClosed) {
            article.classList.add('grayscale', 'opacity-80', 'hover:grayscale-0', 'hover:opacity-100');
            statusBadge = `<div class="absolute top-4 right-4 bg-gray-100 dark:bg-gray-800 px-2.5 py-1 rounded-md text-xs font-bold text-gray-500 dark:text-gray-400 shadow-sm">已截止</div>`;
            statusIcon = `<div class="absolute -bottom-6 left-6 h-12 w-12 rounded-xl bg-white p-1 shadow-md border border-gray-50">
                            <div class="h-full w-full bg-gray-100 rounded-lg flex items-center justify-center text-gray-400">
                                <span class="material-symbols-outlined">event_busy</span>
                            </div>
                          </div>`;
            deadlineText = `<div class="flex items-center gap-1.5 text-gray-400">
                                <span class="material-symbols-outlined text-[18px]">event_busy</span>
                                <span class="text-xs font-medium">已於 ${deadline.toLocaleDateString()} 截止</span>
                            </div>
                            <span class="text-sm font-medium text-gray-400 cursor-not-allowed">已截止</span>`;
        } else {
            statusBadge = `<div class="absolute top-4 right-4 bg-white/90 dark:bg-black/50 backdrop-blur-sm px-2.5 py-1 rounded-md text-xs font-bold text-primary dark:text-white shadow-sm">開放申請</div>`;
            statusIcon = `<div class="absolute -bottom-6 left-6 h-12 w-12 rounded-xl bg-white p-1 shadow-md border border-gray-50">
                            <div class="h-full w-full bg-blue-50 rounded-lg flex items-center justify-center text-blue-500">
                                <span class="material-symbols-outlined">account_balance</span>
                            </div>
                          </div>`;
            if (timeLeft <= 7) {
                deadlineText = `<div class="flex items-center gap-1.5 text-rose-500 dark:text-red-400">
                                    <span class="material-symbols-outlined text-[18px]">schedule</span>
                                    <span class="text-xs font-bold">剩餘 ${timeLeft} 天</span>
                                </div>
                                <a class="text-sm font-bold text-primary hover:text-primary-dark flex items-center gap-1" href="#">
                                    查看詳情 <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
                                </a>`;
            } else {
                deadlineText = `<div class="flex items-center gap-1.5 text-slate-400">
                                    <span class="material-symbols-outlined text-[18px]">event</span>
                                    <span class="text-xs font-medium">截止於 ${deadline.toLocaleDateString()}</span>
                                </div>
                                <a class="text-sm font-bold text-primary hover:text-primary-dark flex items-center gap-1" href="detail.html?id=${scholarship.scholarshipId}">
                                    查看詳情 <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
                                </a>`;
            }
        }

        const unitName = scholarship.sponsorUnit ? scholarship.sponsorUnit.unitName : '未知單位';

        // Admin action buttons
        if (isAdmin) {
            adminButtons = `
                <div class="absolute top-4 left-4 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity z-10">
                    <button onclick="event.stopPropagation(); window.location.href='edit.html?id=${scholarship.scholarshipId}'"
                        class="p-2 bg-white/90 dark:bg-gray-800/90 backdrop-blur-sm rounded-lg shadow-sm hover:bg-blue-50 dark:hover:bg-blue-900/50 text-blue-600 transition-colors" title="編輯">
                        <span class="material-symbols-outlined text-[18px]">edit</span>
                    </button>
                    <button onclick="event.stopPropagation(); deleteScholarship(${scholarship.scholarshipId}, '${scholarship.name.replace(/'/g, "\\'")}')"
                        class="p-2 bg-white/90 dark:bg-gray-800/90 backdrop-blur-sm rounded-lg shadow-sm hover:bg-red-50 dark:hover:bg-red-900/50 text-red-600 transition-colors" title="刪除">
                        <span class="material-symbols-outlined text-[18px]">delete</span>
                    </button>
                </div>
            `;
        }

        // Random gradient for visual variety
        const gradients = [
            'from-blue-600 to-indigo-500',
            'from-emerald-500 to-teal-400',
            'from-orange-400 to-rose-500',
            'from-violet-500 to-purple-500',
            'from-pink-500 to-rose-400'
        ];
        // Use scholarshipId to consistently pick a color, or just random
        const gradientClass = gradients[scholarship.scholarshipId % gradients.length] || gradients[0];

        article.innerHTML = `
            <div class="h-32 w-full bg-gradient-to-r ${gradientClass} relative">
                ${adminButtons}
                ${statusBadge}
                ${statusIcon}
            </div>
            <div class="pt-8 pb-6 px-6 flex flex-col flex-1">
                <div class="mb-1 text-xs font-bold text-slate-400 uppercase tracking-wider">${unitName}</div>
                <h3 class="text-xl font-bold text-[#0f172a] dark:text-white mb-2 group-hover:text-primary transition-colors">${scholarship.name}</h3>
                <div class="flex flex-wrap gap-2 mb-4">
                    <span class="inline-flex items-center rounded-md bg-blue-50 dark:bg-blue-900/30 px-2.5 py-1 text-xs font-bold text-blue-600 dark:text-blue-300 ring-1 ring-inset ring-blue-600/10">${scholarship.type || '一般'}</span>
                </div>
                <p class="text-slate-500 text-sm mb-6 line-clamp-2">
                    ${scholarship.description || '暫無描述'}
                </p>
                <div class="mt-auto pt-4 border-t border-gray-100 dark:border-gray-700 flex items-center justify-between">
                    ${deadlineText}
                </div>
            </div>
        `;

        return article;
    }
</script>

</body>

</html>
